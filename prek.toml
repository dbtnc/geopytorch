[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0" # Ruff version.
hooks = [
  # Run the linter.
  { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },

  # Run the formatter.
  { id = "ruff-format", types_or = ["python", "pyi", "markdown"] },
]

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.12.0"
hooks = [
  { id = "air-format", files = "^r-package/geopytorch-r/", stages = ["pre-commit"] },
]
