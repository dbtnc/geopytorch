[project]
name = "geopytorch"
version = "0.1.0"
description = "Kriging built on GPyTorch"
readme = "README.md"
authors = [
    { name = "dbtnc", email = "203029199+dbtnc@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gpytorch>=1.15.2",
    "numpy<2",
    "torch<2.3.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
