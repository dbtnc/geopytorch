[project]
name = "geopytorch"
version = "0.1.0"
description = "Kriging built on GPyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dbtnc", email = "203029199+dbtnc@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gpytorch>=1.15.2",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
[project.urls]
Homepage = "https://github.com/dbtnc/geopytorch"
Issues = "https://github.com/dbtnc/geopytorch/issues"
